[incoming-internal-extensions]
; context for calling internal extensions via includes.
; Should be used in places like status-open, status-closed, or ${ROUTE}

; Example extension routing
exten = _XXX,1,Playback(calling)
  same => n,set(__ZULU=${EXTEN})                                                ; Set zulu to the number to call
  same => n,Set(__VMCHK=1)                                                            ; Set voicemail check to yes
  same => n,Set(__RingInUse=0)                    ; Set to 1 if you want it to ring a person while they are already on a call aka ring on the 2nd line.
  same => n,Goto(directdial,s,1)                                                       ; call

exten = _XXXX,1,Playback(calling)
  same => n,set(__ZULU=${EXTEN})                                                ; Set zulu to the number to call
  same => n,Set(__VMCHK=1)                                                            ; Set voicemail check to yes
  same => n,Set(__RingInUse=0)                    ; Set to 1 if you want it to ring a person while they are already on a call aka ring on the 2nd line.
  same => n,Goto(directdial,s,1)                                                       ; call

[incoming]
;All incoming lines from the outside will enter here
;including all DID numbers

; +1 shim
exten = _+1NXXNXXXXXX,1,NoOp(EXTEN = ${EXTEN} MODEXTEN = ${EXTEN:-10})
  same => n,Set(CALLERID(num)=${CALLERID(num):-10})             ; Set callerid to right 10 of callerid, stripping off the +1
  same => n,Goto(${EXTEN:-10},1)

; 1 shim
