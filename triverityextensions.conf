  same => n,dumpchan()
  same => n,Dial(PJSIP/${OUTPREFIX}${TEAMSDID}@${TRUNK}${trunkid},,TtkKwWr(ring))
  same => n,gosub(from-internal,errorcheck,1)
  same => n,hangup()
  same => n(nomatch),NoOp(No Teams DID for ${ZULU})
  same => n,Return()

