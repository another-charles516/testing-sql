; Example DID to extension then voice mail
exten = 1234567896,1,Set(__ZULU=1111)
  same => n,Goto(DLUTR,1)

; MAIN goes to MAIN unless there's a worker, then it tries to call worker in status-open, 
; if worker doesn't answer or is not available then leaves a voicemail with the worker
exten = MAIN,1,NoOp()
  same => n,Playback(record/Disclaimer)
  same => n,Set(__ROUTE=AGENTBUSY)
  same => n,Set(__QNM=UNASSIGNED)                       ; Sets the queue to go into
  same => n,Set(__VMCHK=1)                             ; Check voicemail if call isn't answered in direct dial.
  same => n,Set(__RingInUse=1)                    ; Set to 1 if you want it to ring a person while they are already on a call aka ring on the 2nd line.
  same => n,Set(__DirectDialThenRoute=1)                ; send to Route if no answer in directdial
  same => n,Gosub(inbound,s,1)
  same => n,hangup()

; DID to extension then voicemail ( voicemail for the extension )
exten = DTETVM,1,Set(__VMCHK=1)                        ; send to voicemail if no answer in directdial
  same => n,GoSub(Debtor-lookup,s,1)              ; Need to lookup the Debtor for the CDR so the call is not marked as general
  same => n,Gosub(inbound,s,1)
  same => n,Set(__RingInUse=0)                    ; Set to 1 if you want it to ring a person while they are already on a call aka ring on the 2nd line.
  same => n,hangup()

; Debtor Look Up Then Voicemail (voicemail for the extension that was looked up)
exten = DLUTVM,1,GoSub(Debtor-lookup,s,1)              ; Need to lookup the Debtor for the CDR so the call is not marked as general
  same => n,Set(__ZULU=${worker})                      ; Set ZULU to worker that was looked up
  same => n,Set(__VMCHK=1)
  same => n,Set(__RingInUse=0)                    ; Set to 1 if you want it to ring a person while they are already on a call aka ring on the 2nd line.
  same => n,Gosub(inbound,s,1)
  same => n,hangup()

; Debtor Look Up Then Voicemail (voicemail for the extension that was looked up IF they're softphone is loggin in) else it will fall into 'DirectDialThen*'
exten = DLUTVMOB,1,GoSub(Debtor-lookup,s,1)              ; Need to lookup the Debtor for the CDR so the call is not marked as general
  same => n,Set(__ZULU=${worker})                      ; Set ZULU to worker that was looked up
  same => n,Set(__VMCHKOB=1)
;  same => n,Set(__DirectDialThenTeam=1)                ; send to team if no answer in directdial
;  same => n,Set(__DirectDialThenRoute=1)                ; send to Route if no answer in directdial
  same => n,Set(__QNM=)
  same => n,Set(__DirectDialThenQueue=1)                ; send to Queue if no answer in directdial
  same => n,Set(__RingInUse=0)                    ; Set to 1 if you want it to ring a person while they are already on a call aka ring on the 2nd line.
  same => n,Gosub(inbound,s,1)
  same => n,hangup()

; Debtor Look Up Then Voicemail (voicemail for the extension that was looked up IF they're softphone is loggin in) else it will fall into 'DirectDialThen*'.
; If the extension is unavailable (softphone not registered skip the VMbox and go to queue )
; Debtor Look Up then voice mail but skip voicemail when softphone is unavailable
exten = DLUTVMSOU,1,GoSub(Debtor-lookup,s,1)              ; Need to lookup the Debtor for the CDR so the call is not marked as general
  same => n,Set(__ZULU=${worker})                      ; Set ZULU to worker that was looked up
  same => n,Set(__VMCHKSOU=1)
  same => n,Set(__QNM=Collector)
  same => n,Set(__DirectDialThenQueue=1)                ; send to Queue if no answer in directdial
  same => n,Set(__RingInUse=0)                    ; Set to 1 if you want it to ring a person while they are already on a call aka ring on the 2nd line.
  same => n,Gosub(inbound,s,1)
  same => n,hangup()

; Debtor Look Up Then Team
exten = DLUTT,1,GoSub(Debtor-lookup,s,1)              ; Need to lookup the Debtor for the CDR so the call is not marked as general
  same => n,Set(__ZULU=${worker})                      ; Set ZULU to worker that was looked up
  same => n,Set(__DirectDialThenTeam=1)                ; send to team if no answer in directdial
  same => n,Set(__RingInUse=0)                    ; Set to 1 if you want it to ring a person while they are already on a call aka ring on the 2nd line.
  same => n,Gosub(inbound,s,1)
  same => n,hangup()

; Debtor Look Up Then route
exten = DLUTR,1,NoOp()
  same => n,Playback(record/Disclaimer)
  same => n,GoSub(Debtor-lookup,s,1)              ; Need to lookup the Debtor for the CDR so the call is not marked as general
  same => n,ExecIf($["${worker}"!=""]?Set(__ZULU=${worker}))                      ; Set ZULU to worker that was looked up
  same => n,Set(__QNM=${ODBC_LOOKUP-TEAM(${ZULU})})
  same => n,Set(__ROUTE=AGENTBUSY)
  same => n,Set(__DirectDialThenRoute=1)                ; send to Route if no answer in directdial
  same => n,Set(__RingInUse=1)                    ; Set to 1 if you want it to ring a person while they are already on a call aka ring on the 2nd line.
  same => n,Gosub(inbound,s,1)
  same => n,hangup()

; Debtor Look Up Then Queue
exten = DLUTQ,1,GoSub(Debtor-lookup,s,1)              ; Need to lookup the Debtor for the CDR so the call is not marked as general
  same => n,Set(__ZULU=${worker})                      ; Set ZULU to worker that was looked up
  same => n,Set(__QNM=)
  same => n,Set(__DirectDialThenQueue=1)                ; send to Queue if no answer in directdial
  same => n,Set(__RingInUse=0)                    ; Set to 1 if you want it to ring a person while they are already on a call aka ring on the 2nd line.
  same => n,Gosub(inbound,s,1)
  same => n,hangup()

