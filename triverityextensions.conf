; TriVerity Dialplan CT5

; This configuration file is reloaded
; With the "dialplan reload" command in the asterisk CLI
; With the "reload" command (that reloads everything) in the CLI

; All PRI and or SIP lines will and should enter the dialplan
; at the incoming context rather than previously at international

; All internal extensions, click to dial, VB, and any other
; dialing that is initiated from inside the office will enter
; the dialplan at the from-internal context.

; In sip.conf the general context is set to [unauthenticated] meaning
; that if the SIP device is not configured in sip.conf or users.conf
; then it is considered to be an un-authorized call/caller.
; Un-authorized calls/callers will enter the dial plan from the [unauthenticated] context.

[general]
static = yes
writeprotect = no
clearglobalvars = yes
autofallthrough = yes

[globals]
;should match ps_endpoints
TRUNK = SipService

; if your using Dahdi... you'll need to modify the outbound dialing prefixes.
;TRUNK = DAHDI/G1
;TRUNK = DAHDI/g2

; Set TRUNK to DAHDI/G1 if it's ready to take calls, else set it to DAHDI/g2
; ExecIf($["${CHANNEL(DAHDI/G1/state)}" = "READY"]?Set(__TRUNK=DAHDI/G1):Set(__TRUNK=DAHDI/g2))

; Recording file type, must match what's configured in
; /etc/asterisk/recording /etc/asterisk/RecordingPush.bash
FILEEXTENSION=mp3

; PBX ID, uniq per customer
PBXID = 1

; The IP address of the machine running voice broadcasting
VBSERVER = 192.168.1.30

; CALLERID
OUTCALLERIDNUM = 8003771798
OUTCALLERIDNAME = Triverity
OUTCALLERIDALL = ${OUTCALLERIDNAME} <${OUTCALLERIDNUM}>

; local caller id
;LOCALOUTCALLERIDNUM = 6514624400
LOCALOUTCALLERIDNUM = 6514086180
LOCALOUTCALLERIDNAME = ${OUTCALLERIDNAME}
LOCALOUTCALLERIDALL = ${LOCALOUTCALLERIDNAME} <${LOCALOUTCALLERIDNUM}>

; toll free caller id
TOLLFREEOUTCALLERIDNUM = 8003771798
TOLLFREEOUTCALLERIDNAME = ${OUTCALLERIDNAME}
TOLLFREEOUTCALLERIDALL = ${TOLLFREEOUTCALLERIDNAME} <${TOLLFREEOUTCALLERIDNUM}>

; 911 CallerID
EMERGENCYCALLERIDALL = ${OUTCALLERIDNAME} <${OUTCALLERIDNUM}>

; Used in testing
TempNum = 123456789

; General Voicemai box used in office closed
GenVoicemailBox = 1111

; outbound calls willl add this to the the dial string like so... Dial(....${OUTPREFIX}${EXTEN}....)
OUTPREFIX = 20538
;

; Pin to access the admin menu
AdminMenuPin = 9999

; Pin to access the secret menu
SecretMenuPin = 9999

; Pin to access the VM nuke
VmNukePin = 9999

; Pin to access the call forwarding
CallForwardingPin = 9999

; Pin to access the outside listen in
OutsideListenInPin = 9999

; Pin to access voicemails from the outside
OutsideVoicemailPin = 1957

; Pin to make international calls
InternationalCallsPin = 9999

; Pin to access remote listen in
RemoteListenInPin = 9999

; Pin for area code check pin
AreaCodeCheckPin = 9999

[from-internal]
; All internal extensions use this to make outbound calls

include = parkedcalls
include = teams-xfer


; Pickup - If no extension targets are specified, the application will pickup a channel matching the pickup group of the requesting channel
exten = *8,1,pickup()

; Enter conference bridge
exten = *4,1,Goto(sub-conf-bridge,s,1)
  same => n,HangUp()

; This is setup to handle softphone VM quick-key
exten = QK,1,NoOp()
  same => n,Set(CDR(calltype)=${IF($["${CDR(calltype)}"=""]?N:${CDR(calltype)})})               ; if ${CDR(calltype)} is null, set to N, else no change
  same => n,Gosub(VmMain,s,1(${VMBOX}))     

; Example extention -> queue
exten = 222,1,Set(__QNM=COLLECTIONS)
  same => n,Gosub(QUEUE,s,1)
  same => n,Hangup()

;exten = 603,1,Set(__External=0123456789)
;  same => n,Goto(External,1)

; External calling, set ${External} to number to dial. Will record the call. 
exten = External,1,NoOp(calling out to ${External})
  same => n,Gosub(sub-outbound,s,1(${External}))
  same => n,Dial(PJSIP/${OUTPREFIX}${External}@${TRUNK}${trunkid}/,,b(PreDialHandler^s^1)TKWgr(ring)b(sub-record-call^s^1(${ORIG_SRC}))
  same => n,gosub(errorcheck,1)

; secret admin menu
exten = **1,1,Goto(admin,s,1)

; Method for collectors to record their extension based answering machine hand off
exten = **2,1,Goto(collector-record,s,1)

; Setup call forwarding
exten = **3,1,Authenticate(${CallForwardingPin})
  same => n,Goto(call-forward,s,1)

; Calling internal extensions handling call forwarding 3 digit
exten = _[12345689]XX,1,set(__ZULU=${EXTEN})  
  same => n,Goto(INT,1)

; Calling internal extensions handling call forwarding 4 digit
exten = _[12345689]XXX,1,set(__ZULU=${EXTEN})  
  same => n,Goto(INT,1)                                                 ; call

; Calling internal extensions handling call forwarding
exten = INT,1,Playback(calling)
  same => n,Set(__CALLDIR=${IF($["${CALLDIR}"=""]?N:${CALLDIR})})                     ; if CALLDIR is null, set it to N, else no change
  same => n,Set(CDR(pbxid)=${PBXID})
  same => n,Set(CDR(dnid)=${CALLERID(dnid)})
  same => n,Set(CDR(calltype)=${IF($["${CDR(calltype)}"=""]?N:${CDR(calltype)})})     ; if $(CDR(calltype)) is null, set to N, else no change
  same => n,GotoIf($["${CALLERID(num)}"="${ZULU}"]?mail:dial)                        ; if your calling your own extension, go to mail, else dial.
  same => n(mail),Gosub(VmMain,s,1(${ZULU}))                                         ; go to the voicemail box dialed

  same => n(dial),ExecIf($["${DB(FORWARD/${ZULU}/ENABLED)}" = "1"]?Set(__ZULU=${DB(FORWARD/${ZULU}/FWDNUM)}):NoOp(Not a forwarded call))
  same => n,GotoIf($[${ZULU} < 9999]?Internal)

  same => n(Outbound),Goto(from-internal,9${ZULU},1)
  same => n,Hangup()

  same => n(Internal),Set(__CTDEST=${ZULU})
  same => n,Gosub(teams-xfer,${ZULU},1)
  same => n,GotoIf($["${DEVICE_STATE(PJSIP/${ZULU})}"="NOT_INUSE"]?:vmbox)
  same => n,Dial(PJSIP/${ZULU},24,twr(ring))
  same => n(vmbox),Gosub(VMBox,s,1(${ZULU},u))
  same => n,Hangup()

; 911 call
exten = 9911,1,Set(CALLERID(all)=${EMERGENCYCALLERIDALL})
  same => n,Set(trunkid=${IF($["${PJSIP_CONTACT(${PJSIP_AOR(SipService1,contact)},status)}"="Reachable"]?1:2)})   ; Determine which trunk to dial
  same => n,Dial(PJSIP/${OUTPREFIX}${EXTEN:1}@${TRUNK}${trunkid}/,,b(PreDialHandler^s^1)TKWgr(ring))                          ; Dial out trunk determined by preceeding line
  same => n,gosub(errorcheck,1)
  same => n,Hangup()

