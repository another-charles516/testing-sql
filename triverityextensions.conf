;Local and long distance
exten = errorcheck,1,NoCDR()
  same => n,Set(HANGUPCAUSE_STRING=${HANGUPCAUSE_KEYS()})
;  same => n,Set(ARRAY(item)=${HANGUPCAUSE_STRING})
  same => n,Set(ARRAY(CH1,CH2)=${HANGUPCAUSE_STRING})
  same => n,Set(item=${IF($["${CH1:0:16}"="PJSIP/SipService"]?${CH1}:${CH2})})
  same => n,Set(__SIPHANGUPCODE=${CUT(HANGUPCAUSE(${item},tech), ,2)})
  same => n,NoOp(*** phone number is ${CALLERID} error code is ${SIPHANGUPCODE} item = ${item} )
  same => n,ExecIf($["${SIPHANGUPCODE}" = "200"]?Return():NoOp())
  same => n,ExecIf($["${SIPHANGUPCODE}" = "486"]?busy():NoOp())
  same => n,ExecIf($["${SIPHANGUPCODE}" = "504"]?busy():NoOp())
  same => n,GoToIf($["${SIPHANGUPCODE}" = "500"]?errplay)
  same => n,GoToIf($["${SIPHANGUPCODE}" = "503"]?errplay)
  same => n,GoToIf($["${SIPHANGUPCODE}" = "603"]?errplay)
  same => n,GoToIf($["${SIPHANGUPCODE}" = "604"]?errplay)
  same => n,Playback(Record/cannotcomplete)
  same => n,SayDigits(${SIPHANGUPCODE})
  same => n,return()
  same => n(errplay),Playback(Record/${SIPHANGUPCODE})
  same => n,return()
  

