[AGENTBUSY]
;this route plays a message giving the caller the option to go to the voicemail box of their collector or to a queue based on balance

exten = s,1,NoOp()
  same => n,GoToIf($["${QNM}"="VOICEMAILONLY"]?1,1)
  same => n,Background(record/AgentUnavailable)
  same => n,WaitExten(5)
  same => n,Goto(1,1)

exten = 1,1,NoOp(pressed 1 to leave a message)
  same => n,GoSub(VMBox,s,1(${ZULU},u))
  same => n,Hangup()

exten = 2,1,NoOp(pressed 2 to be routed to queue)
  same => n,GoSub(SET-QUEUE-NAME,s,1)
  same => n,execif($["${QNM}" = ""]?Set(__QNM=ADMIN) )
  same => n,GoTo(QUEUE,s,1)
  same => n,Hangup()
  
[SET-QUEUE-NAME]
;this context sets the queue name for a call based on ZULU
; This should really be a debtmaster lookup, like lookup the team based on ZULU

exten = s,1,NoOp()
  same => n,Set(__QNM=${ODBC_LOOKUP-TEAM(${ZULU})})
  same => n,return()

[status-open]
; time rules context

; ARG1 is recording name
include = incoming-internal-extensions

exten = s,1,NoOp()
  same => n,ExecIf($["${recording}"="silence/1"]?NoOp(silent time rule):Background(${recording}))         ; play back recording from time rule unless its silence
  same => n,GoSub(Debtor-lookup,s,1)					; Look up debtor via caller id
  same => n,Gotoif($["${worker}"!=""]?directdial,s,1)		        ; If worker was looked up, call em
  same => n,Gosub(Debtor-lookup-prompt,s,1)				; Ask caller for debtor ID
  same => n,ExecIf($["${worker}"!=""]?goto(directdial,s,1))             ; If worker was looked up, call em
  same => n,Goto(QUEUE,s,1)						; Go to the queue that was set in incoming
;  same => n,Goto(${ROUTE},s,1)						; Go to route var which is set in the incoming context

exten = h,1,Gosub(sub-update-recording,s,1)

[status-closed]
