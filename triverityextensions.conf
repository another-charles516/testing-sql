[QUEUE]
;Advanced queue for all except vb

exten = s,1,Answer
  same => n,Set(DD_ROLLED=1)
  same => n,Gosub(sub-record-call,s,1)
  same => n,GotoIf($["${DB(PhoneDisplay/${QNM})}"=""]?skip:)
  same => n,ExecIf($[${REGEX("${DB(PhoneDisplay/${QNM})}" "${CALLERID(name)}")}]?NoOp(CallerId Already set):Set(CALLERID(name)=${DB(PhoneDisplay/${QNM})}-${CALLERID(name)}))
  same => n(skip),Set(CALLDIR=I)
  same => n(queue),Queue(${QNM},twr,,,${DB(TimeInQueue/${QNM})})
  same => n,NoOp( QUEUESTATUS = ${QUEUESTATUS} )
  same => n,ExecIf($["${QUEUESTATUS}"="UNKNOWN"]?Hangup())
  same => n,ExecIf($["${DB(ReturnVM/${QNM})}"=""]?NoOp(No return ReturnVM set):Gosub(VMBox,s,1(${DB(ReturnVM/${QNM})},u)))
  same => n,GotoIf($["${DB(ReturnContext/${QNM})}"=""]?SkipReturnContext:)
  same => n,ExecIf($[DIALPLAN_EXISTS(${DB(ReturnContext/${QNM})},s,1)]?Goto(${DB(ReturnContext/${QNM})},s,1):NoOp(ERROR Return context ${DB(ReturnContext/${QNM})},s,1 is not valid))
  same => n(SkipReturnContext),ExecIf($["${DB(ReturnQueue/${QNM})}"=""]?NoOp(No return ReturnQUEUE set):Set(__QNM=${DB(ReturnQueue/${QNM})}))
  same => n,GotoIf($["${QUEUESTATUS}"="LEAVEEMPTY" | "${QUEUESTATUS}"="JOINEMPTY"]?status-closed,s,1:)          ; If we can't join the queue and there's no where else to go this would loop, somethings big wrong, pushed to closed
  same => n,Goto(QUEUE,s,1)                     ; and around we go i guess... If neither ReturnVM, ReturnContext, or ReturnQueue are set, something is wrong with the db, so we'll just loop back into the orginal queue.

