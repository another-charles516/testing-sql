  same => n,Set(CDR(userfield)=${ENTITY})
  same => n,Set(__Entity_ID=${CUT(CDR(userfield),^,1)})
  same => n,Set(CDR(campaign)=${CAMPAIGN})
  same => n,Set(CDR(destnum)=${CTVBNUM})
