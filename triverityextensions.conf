[call-forward]
; Setups up call forwarding

exten = s,1,Answer()
  same => n,Set(TIMEOUT(digit)=2)

  same => n(ext),READ(EXT,please-enter-your-extension)          ; Ask for extension you would like to forward from
  same => n,GoToIF($["${EXT}" = ""]?call-forward,h,1:)          ; if no extension given, hangup
  same => n,VMauthenticate(${EXT})                              ; Ask for VM box code assocated to given extension
  same => n,GotoIf($["${DB(FORWARD/${EXT}/ENABLED)}" = "1"]?enabled:)   ; Check if forwarding is enabled for given extension
  same => n(disabled),Playback(call-forwarding)
  same => n,Playback(currently)
  same => n,Playback(disabled)
  same => n,Goto(menu)
  same => n(enabled),Playback(call-forwarding)                  ; say call forwarding is currently enabled
  same => n,Playback(currently)
  same => n,Playback(enabled)
  same => n(menu),Background(record/ForwardMenu)                        ; Press 1 to toggle call forwarding enabled vs disabled, press to change call forwarding destination
  same => n,WaitExten(5)

exten = 1,1,Wait(0.5)
  same => n,GotoIf($["${DB(FORWARD/${EXT}/ENABLED)}" = "1"]?disable:enable)     ; if disabled then enable, if enabled then disable. Toggle.

  same => n(enable),Set(DB(FORWARD/${EXT}/ENABLED)=1)           ; enable call forwarding
  same => n,Playback(call-forwarding)
  same => n,Playback(now)
  same => n,Playback(enabled)
  same => n,GoTo(s,menu)

  same => n(disable),Set(DB(FORWARD/${EXT}/ENABLED)=0)          ; disable call forwarding
  same => n,Playback(call-forwarding)
  same => n,Playback(now)
  same => n,Playback(disabled)
  same => n,GoTo(s,menu)

