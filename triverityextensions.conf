[inbound]
; Intermediary between incoming calls and open or closed
; sets vars and checks blacklist

exten = s,1,Answer()
  same => n,Set(__INTIME=${STRFTIME(${EPOCH},,%Y-%m-%d %H:%M:%S)})
  same => n,Set(TIMEOUT(digit)=2)
  same => n,Set(CALLERID(num)=${CALLERID(num):-10})             ; Set callerid to left 10 of callerid, stripping off the 1
  same => n,GotoIf($["${CALLERID(num)}"=""]?skipbl:)                    ; if callerid null skip blacklist check.
  same => n,Gosub(sub-blacklist,s,1,(${CALLERID(num)},I))

  same => n(skipbl),Set(__ORIG_SRC=${IF($["${CALLERID(num)}"=""]?UNKNOWN:${CALLERID(num)})})    ; if callerid null call it unknown, else no change.
  same => n,Set(__CTCALLERID=${IF($["${CALLERID(num)}"=""]?UNKNOWN:${CALLERID(num)})})  ; used by debtmaster call link function
  same => n,Set(CDR(calltype)=${IF($["${CDR(calltype)}"=""]?I:${CDR(calltype)})})       ; if blank set to I, else keep existing value
  same => n,Set(CDR(pbxid)=${PBXID})
  same => n,Set(CDR(dnid)=${IF($["${CDR(dnid)}"=""]?${CALLERID(dnid)}:${CDR(dnid)})})   ; if cdr(dnid) is blank, set it to callerid(dnid), else no change
  same => n,Set(__CALLDIR=${IF($["${CALLDIR}"=""]?I:${CALLDIR})})                       ; if calldir is blank, set it to I, else no change
  same => n,Set(__ORIG_TYPE=${IF($["${ORIG_TYPE}"=""]?I:${ORIG_TYPE})}) ; if blank set to I, else keep existing value
  same => n,Set(__ORIGQ=${IF($["${ORIGQ}"=""]?${QNM}:${ORIGQ})})                        ; if blank set to QNM, else keep existing value
  same => n,Set(__ORIGCTXT=${IF($["${ORIGQ}"=""]?${ROUTE}:${ORIGCTXT})})        ; if blank set to ROUTE, else keep existing value
  same => n,ExecIf($["${SkipTimeRulesAndRoute}"="1"]?Goto(${ROUTE},s,1):NoOp(Not Skipping time rules for route))			; If SkipTimeRulesAndRoute is true, just go to route bypassing time rules.
  same => n,ExecIf($["${SkipTimeRulesAndQueue}"="1"]?Goto(QUEUE,s,1):NoOp(Not Skipping time rules for queue))			; If SkipTimeRulesAndQueue is true, just go to queue bypassing time rules.
  same => n,Execif($["${ZULU}"!=""]?Goto(directdial,s,1):NoOp(Checking time rules))    ; If ZULU is set, it's a direct call, else time rules
  same => n,Set(__OfficeStatus=${ODBC_OFFICESTATUS()})                                  ; Call postgresql checktimerulesrec() function
  same => n,Set(__context=${CUT(OfficeStatus,\,,1)})                                            ; parse for context name
  same => n,Set(__recording=${CUT(OfficeStatus,\,,2)})                                  ; parse for record name
  same => n,GotoIf($["${DB(OFFICE/STATUS/EMERGENCY)}" = "ON"]?status-emergency,s,1)   ; Check for office emergency mode
  same => n,Gotoif($[${DIALPLAN_EXISTS(${context},s,1)}]?validC:invalidC)

  same => n(validC),GoSub(${context},s,1)                ; go to valid context

  same => n(invalidC),NoOP(ERROR BAD TIME RULE CONTEXT: ${context} I guess we are closed...)
  same => n,Set(__recording=record/OfficeClosed)  ; Just say the office is closed
  same => n,GoSub(Office-closed,s,1)              ; bad time rule catch


[sub-outbound]
; Check blank list and then set up vars/data to make outbound call

exten = s,1,NoOp()
  same => n,Set(__CTDEST=${ARG1})  ;This is used by DM for call recording entries
;  same => n,GotoIf($["${INT}"="YES"]?BL:)
;  same => n,Set(__ACODE=${CTDEST:0:3})
;  same => n,GoSub(sub-US-areacode-check,s,1(${ACODE}))
  same => n(BL),Gosub(sub-blacklist,s,1,(${CTDEST},O))                                                          ; Check black list
  same => n,Set(__SPYGROUP=${IF($["${SPYGROUP}"=""]?${CALLERID(num)}:${SPYGROUP})})     ; ;Used by Ast for ChanSpy
  same => n,Set(__INTIME=${IF($["${INTIME}"=""]?${STRFTIME(${EPOCH},,%Y-%m-%d %H:%M:%S)}:${INTIME})})   ; if INTIME is blank, set it, else no change
  same => n,Set(__ENTITY=${IF($["${ENTITY}"=""]?0^G^CT_:${ENTITY})})                                    ; if entity is blank, set it to 0^G^CT_, else no change
  same => n,Set(CDR(userfield)=${IF($["${CDR(userfield)}"=""]?${ENTITY}:${CDR(userfield)})})    ; if cdr(userfield) is blank, set it to ENITTY, else no change
  same => n,Set(__Entity_ID=${IF($["${Entity_ID}"=""]?${CUT(CDR(userfield),^,1)}:${Entity_ID})})         ; if Entity_ID is blank, set it to a cut of cdr(userfield), else no change
  same => n,Set(CDR(calltype)=${IF($["${CDR(calltype)}"=""]?O:${CDR(calltype)})})               ; if cdr(calltype) is blank, set it to O, else no change
  same => n,Set(CDR(pbxid)=${PBXID})
  same => n,Set(CDR(dnid)=${IF($["${CDR(dnid)}"=""]?${CALLERID(dnid)}:${CDR(dnid)})})  ; if cdr(dnid) is blank, set it to callerid(dnid), else no change
  same => n,Set(__CALLDIR=${IF($["${CALLDIR}"=""]?O:${CALLDIR})})                       ; if calldir is blank, set it to O, else no change
  same => n,Set(__CAMPAIGN=${IF($["${CAMPAIGN}"=""]?Outbound:${CAMPAIGN})})             ; if CAMPAIGN is blank, set it to Outbound, else no change
  same => n,Set(__ORIG_TYPE=${IF($["${ORIG_TYPE}"=""]?O:${ORIG_TYPE})})                 ; if ORIG_TYPE is blank, set it to O, else no change
  same => n,Set(__ORIG_SRC=${IF($["${ORIG_SRC}"=""]?${CALLERID(num)}:${ORIG_SRC})})     ; if ORIG_SRC is blank, set it to callerid, else no change
  same => n,Set(__CTSOURCE=${IF($["${CTSOURCE}"=""]?${CALLERID(num)}:${CTSOURCE})})     ; if CTSOURCE is blank, set it to callerid, else no change ; This is used by DM for call recording entries
  same => n,Set(__TOUCH_MONITOR=${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}^${ENTITY}^${CTSOURCE}^${CTDEST})
  same => n,Set(__CTCALLERID=${CTDEST})							; Used by debtmaster call link function
  same => n,System(echo "${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}^${ENTITY}^${CTSOURCE}^${CTDEST}" >> /var/log/asterisk/outboundcalls)
  same => n,Set(trunkid=${IF($["${PJSIP_CONTACT(${PJSIP_AOR(SipService1,contact)},status)}"="Reachable"]?1:2)})
  same => n,Return()
  same => n,Hangup()

[OUTCALLERID-BY-PREFIX]
;this context does a callerid set based on a query of a postgres table
exten = s,1,NoOp(prefix = ${ARG1}  )
same => n,Set(__OUTCALLERIDY=${ODBC_OUTCALLERID-BY-PREFIX(${ARG1})} )
same => n,ExecIf($["${OUTCALLERIDY}"=""]?Set(__OUTCALLERIDY=${OUTCALLERIDNUM}):NoOp(Found callerid in database))
same => n,Set(CALLERID(all)=${OUTCALLERIDNAME}<${OUTCALLERIDY}>)
same => n,Return()

[directdial]
; Called from incoming-internal-extensions
; Can be called from places decending from status-open, status-closed, etc..
; Handles dialing for incoming calls.
; ZULU = who to call and should be set before getting here
; If ZULU is not set, it will assume worker
; On no answer, if VMK is 1, it will go to VM, else it will hangup
exten = s,1,Answer()
  same => n,ExecIf($[${EXISTS(${ZULU})}]?NoOp( calling ${ZULU} ):Set(__ZULU=${worker}))    ; If ZULU is set, use it, else use worker
  same => n,GoSub(sub-record-call,s,1(${ZULU}))                                         ; Set up recording for this call
  same => n(Cont),Gosub(sub-blacklist,s,1,(${CALLERID(num)},I))                         ; Check blacklist for ${CALLERID(num)} with O
  same => n,Set(__ENTITY=${IF($["${ENTITY}"=""]?0^G^CT_:${ENTITY})})                    ; if ${ENTITY} is null, set it to 0^G^CT_, else no change

  same => n,ExecIf($["${DB(FORWARD/${ZULU}/ENABLED)}" = "1"]?Set(__ZULU=${DB(FORWARD/${ZULU}/FWDNUM)}):NoOp(Not a forwarded call))
  same => n,GotoIf($[${ZULU} = 9999]?QUEUE,s,1)
  same => n,GotoIf($[${ZULU} <= 9999]?Internal)

  same => n(Outbound),Goto(from-internal,9${ZULU},1)
  same => n,Goto(${DIALSTATUS},1)

  same => n(Internal),Set(__CTDEST=${ZULU})
  same => n,Set(CHANNEL(hangup_handler_push)=sub-directdial-hangup,s,1)
  same => n,Gotoif($["${RingInUse}"="1"]?Dial)    ; If RingInUse is set 1, don't skip sip device state check, we are ringing them anyways. 
  same => n,GotoIf($["${DEVICE_STATE(PJSIP/${ZULU})}"!="NOT_INUSE"]?BUSY,1:)
  same => n(Dial),Dial(PJSIP/${ZULU},24,twgr(ring))
  same => n,Set(DD_STATUS=${DIALSTATUS})
  same => n,Goto(${DIALSTATUS},1)

exten = ANSWER,1,hangup()

exten = BUSY,1,Goto(going,1)

exten = NOANSWER,1,Goto(going,1)

exten = CHANUNAVAIL,1,Goto(going,1)

exten = CONGESTION,1,Goto(going,1)

; After no answer, if VMCHK is 1 and mailbox exists, go to voicemailbox.
; Then if DirectDialThenRoute is 1, go to route.
; Then if DirectDialThenQueue is 1, go to route.
; Then if DirectDialThenTeam is 1, go to Team
exten = going,1,ExecIf($[ "${VMCHKSOU}" = "1" & ${REGEX("^(INVALID|UNKNOWN|UNAVAILABLE)$" ${DEVICE_STATE(PJSIP/${ZULU})})} = 1 ]?Goto(QUEUE,s,1):NoOp())
  same => n,ExecIf($[ "${VMCHKSOU}" = "1" & $[${VM_INFO(${ZULU}@default,exists)}|${VM_INFO(${ZULU}@non-default,exists)}]]?Gosub(VMBox,s,1(${ZULU},u):NoOp())
  same => n,ExecIf($[$["${VMCHK}"="1"]&${VM_INFO(${ZULU}@default,exists)}]?Gosub(VMBox,s,1(${ZULU},u)):NoOp(No voicemail box for ${ZULU}@default))
  same => n,ExecIf($[$["${VMCHK}"="1"]&${VM_INFO(${ZULU}@non-default,exists)}]?Gosub(VMBox,s,1(${ZULU},u)):NoOp(No voicemail box for ${ZULU}@non-default))
  same => n,ExecIf($[ "${VMCHKOB}" = "1" & ${VM_INFO(${ZULU}@default,exists)} = 1 & ${REGEX("^(INUSE|RINGING|RINGINUSE|ONHOLD)$" ${DEVICE_STATE(PJSIP/${ZULU})})} = 1 ]?Gosub(VMBox,s,1(${ZULU},u)):NoOp(Not checking voicemail))
  same => n,ExecIf($[ "${VMCHKOB}" = "1" & ${VM_INFO(${ZULU}@non-default,exists)} = 1 & ${REGEX("^(INUSE|RINGING|RINGINUSE|ONHOLD)$" ${DEVICE_STATE(PJSIP/${ZULU})})} = 1 ]?Gosub(VMBox,s,1(${ZULU},u)):NoOp(Not checking voicemail))
  same => n,ExecIf($["${DirectDialThenRoute}"="1"]?Goto(${ROUTE},s,1):NoOp())
  same => n,ExecIf($["${DirectDialThenQueue}"="1"]?Goto(QUEUE,s,1):NoOp())
  same => n,ExecIf($["${DirectDialThenTeam}"="1"]?Goto(TeamThenQueue,s,1):NoOp(Direct dial then what? We should never get here, dialplan problem)
  same => n,return()

exten = h,1,Gosub(sub-update-recording,s,1)

; If you want calls that hangup before connecting to send a email to the extension's vocemail's email address.
;  same => n,system(echo -e "To: ${ODBC_LOOKUP-EMAIL(${ZULU})}\nSubject: Missed call from ${ORIG_SRC}\n\nMissed call from ${ORIG_SRC}" | ssmtp ${ODBC_LOOKUP-EMAIL(${ZULU})})

[sub-directdial-hangup]
; Sends a missed call email if the call was not answered, did not go to a queue, and no voicemail was left
exten = s,1,Set(LOCAL(st)=${IF($["${DD_STATUS}" = ""]?${DIALSTATUS}:${DD_STATUS})})
  same => n,NoOp(missed-check st=${st} VMSTATUS=${VMSTATUS} CTDEST=${CTDEST} ORIG_TYPE=${ORIG_TYPE} DD_ROLLED=${DD_ROLLED})
  same => n,GotoIf($["${ORIG_TYPE}" != "I"]?rec)
  same => n,GotoIf($["${st}" = "ANSWER"]?rec)
  same => n,GotoIf($["${DD_ROLLED}" = "1"]?rec)
  same => n,GotoIf($["${VMSTATUS}" = "SUCCESS"]?rec)
  same => n,Set(LOCAL(email)=${ODBC_LOOKUP-EMAIL(${CTDEST})})
  same => n,GotoIf($["${email}" = ""]?rec)
  same => n,Set(LOCAL(src)=${FILTER(0-9A-Za-z +,${ORIG_SRC})})
  same => n,System(printf 'To: %s\nSubject: Missed call from %s\n\nMissed call from %s\n' '${email}' '${src}' '${src}' | /usr/sbin/ssmtp '${email}')
  same => n(rec),GotoIf($["${RecordingSaved}" = "1"]?done)
  same => n,Gosub(sub-update-recording,s,1)
  same => n(done),Return()

[TeamThenQueue]
; Looks up the team(queue) assigned in debtmaster and tries to go to the assigned queue
; else else it just goes to a default queue 'queue1'

exten = s,1,NoOp(Extension is ${ZULU})
same => n,Set(__TEAMNAME=${ODBC_LOOKUP-TEAM(${ZULU})})
same => n,ExecIf($["${TEAMNAME}"=""]?Set(__QNM=queue1):NoOp())          ; if there's no teamname default to queue1
same => n,goto(QUEUE,s,1)

exten = h,1,Gosub(sub-update-recording,s,1)

[collector-record]
; This is for listening to and recording the voicemail handoff message

exten = s,1,Answer()
  same => n,VMauthenticate(${CALLERID(num)})                    ; prompt for voicemail passcode
  same => n(msg),wait(1)
  same => n,Background(record/HandOffMenu)              ; Say options 1= play the current message,2= record the message,3= play menu options, 9= Hangup
  same => n,WaitExten(10)                                                               ; Wait for user input for 10 seconds. Then go to an extension in this context based on the users input.

exten = 1,1,Playback(record/${CALLERID(num)})                   ; play back recorded message
  same => n,Goto(s,msg)

exten = 2,1,Playback(vm-intro)
  same => n,Record(record/${CALLERID(num)}.ulaw)                ; record message
  same => n,Playback(vm-saved)                                          ; say vm-saved
  same => n,Goto(s,msg)

exten = 3,1,Goto(s,msg)

exten = 9,1,Hangup()

exten = i,1,Playback(invalid)
  same => n,Goto(s,msg)

exten = t,1,Goto(s,msg)

[sub-save-recording-record]
; This context saves the call recording record to sybase, if fails saves it to postgres, if that fails as well, saves to file

exten = s,1,NoOp(RECORD_NAME = ${RECORD_NAME} Entity_ID = ${Entity_ID} entity_type = ${entity_type} usrid=${usrid} ORIG_SRC = ${ORIG_SRC} CTDEST = ${CTDEST} RECPATH = ${RECPATH} RECEND = ${RECEND})
  same => n,gotoif($["${RECORD_NAME}"=""]?CtRecordingSuccess:)                  ; If there's no recording, don't try to save a recording record
  same => n,Set(ODBC_CTRECORDING()=${RECORD_NAME},${Entity_ID},${entity_type},${usrid},${ORIG_SRC},${CTDEST},${RECPATH},${RECEND}) ;DM Recording list
  same => n,gotoif($["${ODBCSTATUS}"="FAILURE"]?CtRecordingFail:CtRecordingSuccess)

  same => n(CtRecordingFail),NoOp(Error saving CTRECORDING to sybase, saving to postgresql table instead)
  same => n,Set(ODBC_CTRECORDINGHOLD()=${RECORD_NAME},${Entity_ID},${entity_type},${usrid},${ORIG_SRC},${CTDEST},${RECPATH},${RECEND})
  same => n,gotoif($["${ODBCSTATUS}"="FAILURE"]?CtRecordingHoldFail:CtRecordingSuccess)

  same => n(CtRecordingHoldFail),NoOp(Error saving CTRECORDING to postgresql, saving to file instead)
  same => n,System(echo "${RECORD_NAME},${Entity_ID},${entity_type},${usrid},${ORIG_SRC},${CTDEST},${RECPATH},${RECEND}" >> /var/log/asterisk/RecordingRecordhold)

  same => n(CtRecordingSuccess),return()

[sub-update-recording-in]
; Called from sub-update-recording for inbound call vars

exten = s,1,NoOp()
  same => n,Set(__puexten=${CUT(DstChanExten,/,2)})
  same => n,Gotoif($["${puexten}"=""]?nopuexten)
  same => n,Set(__usrid=${ODBC_USERID(${puexten})})
  same => n(nopuexten),Return()

[sub-update-recording-out]
; Called from sub-update-recording for outbound call vars

exten = s,1,NoOp()
  same => n,Set(__puexten=${CTSOURCE})
  same => n,Gotoif($["${puexten}"=""]?nopuexten)
  same => n,Set(__usrid=${ODBC_USERID(${puexten})})
  same => n(nopuexten),Set(__CTDEST=${IF($["${CTDEST}"=""]?${puexten}:${CTDEST})})
  same => n,Set(__CTDEST=${IF($["${CTDEST}"=""]?${QNM}:${CTDEST})})
  same => n,Return()

[sub-update-recording-internal]
; Called from sub-update-recording for internal call vars

exten = s,1,NoOp()
  same => n,Set(__puexten=${CUT(DstChanExten,/,2)})
  same => n,Gotoif($["${puexten}"=""]?nopuexten)
  same => n,Set(__usrid=${ODBC_USERID(${puexten})})
  same => n(nopuexten),Set(__CTDEST=${IF($["${CTDEST}"=""]?${puexten}:${CTDEST})})
  same => n,Set(__CTDEST=${IF($["${CTDEST}"=""]?${QNM}:${CTDEST})})
  same => n,Return()

[sub-update-recording]
exten = s,1,StopMixMonitor()
  same => n,Set(__CTRECORD=${IF($["${CTRECORD}"=""]?${MASTER_CHANNEL(CTRECORD)}:${CTRECORD})})
  same => n,GoToIf($["${CTRECORD}"!="TRUE"]?return:)
  same => n,Set(__RECEND=${STRFTIME(${EPOCH},,%Y-%m-%d %H:%M:%S)})
  same => n,Set(__OUTTIME=${STRFTIME(${EPOCH},,%Y-%m-%d %H:%M:%S)})
  same => n,Set(__RECPATH=\\${STRFTIME(${EPOCH},,%Y\\%m\\%d\\)})
  same => n,Set(__RECORD_NAME=${IF($["${RECORD_NAME}"=""]?${MASTER_CHANNEL(RECORD_FILENAME)}:${RECORD_NAME})})
  same => n,Set(__RECORD_NAME=${RECORD_NAME}.${FILEEXTENSION}) ; Add file extension
  same => n,Set(__CAMPAIGN=${IF($["${CAMPAIGN}"=""]?${CTDEST}:${CAMPAIGN})})
  same => n,Set(__DstChan=${CUT(CDR(dstchannel),-,1)})
  same => n,Set(__DstChanExten=${CUT(DstChan,@,1)})
  same => n,Set(__ORIG_SRC=${IF($["${ORIG_SRC}"=""]?${CALLERID(num)}:${ORIG_SRC})})
  same => n,Set(__ENTITY=${IF($["${CUT(ENTITY,^,1)}"="0" | "${CUT(ENTITY,^,1)}"=""]?${CUT(ENTITY,^,-2)}^${usrid}:${ENTITY})})
  same => n,Set(__entity_type=${CUT(ENTITY,^,2)}) ; set entity type from ENTITY
  same => n,Set(__entity_id=${CUT(ENTITY,^,1)})
  same => n,Set(CDR(userfield)=${ENTITY})
  same => n,GosubIf($["${CDR(calltype)}"="O"]?sub-update-recording-out,s,1:)
  same => n,GosubIf($["${CDR(calltype)}"="I"]?sub-update-recording-in,s,1:)
  same => n,GosubIf($["${CDR(calltype)}"="N"]?sub-update-recording-internal,s,1:)
  same => n,Gotoif($["${RecordingSaved}"="1"]?return:)                  ; Make sure we haven't added the record yet (transfers get here twice)
  same => n,GoSub(sub-save-recording-record,s,1)                        ; Save recording record
  same => n,Set(__RecordingSaved=1)
  same => n(return),return()

[sub-auto-answer]
; Set call to auto answer
exten = s,1,Set(PJSIP_HEADER(add,Alert-Info)=Internal)
  same => n,return()

[sub-record-call]
; ARG1 = Source of the call to be checked against the no-record blacklist
exten = s,1,NoOp()
  same => n,GotoIf($["${ATTENDEDTRANSFER}"=""]?:rtn)
  same => n,GotoIf($["${sanity}"="1"]?rtn); Make sure i haven't been here before
  same => n,Set(__sanity=1) ; I have been here
  same => n,Execif($["${ARG1}"!=""]?GotoIf($[${DB_EXISTS(EXTENSION/NORECORD/${ARG1})}]?rtn:):NoOp(Not checking no record list for this call)) ; check for no record on exten
  same => n,ExecIf($["${AutoAnswer}"="1"]?Set(PJSIP_HEADER(add,Alert-Info)=Internal):NoOp())            ; If AutoAnswer is set to 1, add the pjsip head for one touch dial
  same => n,Set(__CTRECORD=TRUE)                ; Can record
  same => n,Set(MASTER_CHANNEL(CTRECORD)=${CTRECORD})
  same => n,Set(__CTSOURCE=${IF($["${CALLERID(num)}"=""]?unknown:${CALLERID(num)})})
  same => n,Set(__MIXMONITOR_FILENAME=${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${UNIQUEID})
  same => n,Set(MASTER_CHANNEL(RECORD_FILENAME)=${MIXMONITOR_FILENAME})
  same => n,Set(__RECORD_NAME=${MIXMONITOR_FILENAME})
  same => n,Set(__DATETIME=${STRFTIME(${EPOCH},,%Y-%m-%d)})
  same => n,Set(__RECSTRT=${STRFTIME(${EPOCH},,%Y-%m-%d %H:%M:%S)})
  same => n,Set(__RECSTSEC=${STRFTIME(${EPOCH})})
  same => n,MixMonitor(${MIXMONITOR_FILENAME}.wav,r(${MIXMONITOR_FILENAME}r.wav)t(${MIXMONITOR_FILENAME}t.wav),/etc/asterisk/recording ${MIXMONITOR_FILENAME}r.wav ${MIXMONITOR_FILENAME}t.wav ${Entity_ID})
  same => n(rtn),Return()

