exten = default,1,Voicemail(${ARG1}@default,${ARG2})
  same => n,hangup()

exten = non-default,1,Voicemail(${ARG1}@non-default,${ARG2})
  same => n,hangup()

; If they hung up before leaving a message send a email about a missed call
;exten = h,1,NoOp(VMstatus = ${VMSTATUS} CALLTYPE = ${CDR(calltype)})
;  same => n,GotoIf($["${VMEMAIL}"="1"&&"${CDR(calltype)}"="I"]?:end)
;  same => n,system(echo -e "To: ${ODBC_LOOKUP-EMAIL(${ARG1})}\nSubject: Missed call from ${ORIG_SRC}\n\nMissed call from ${ORIG_SRC}" | ssmtp ${ODBC_LOOKUP-EMAIL(${ARG1})})
;  same => n(end),Hangup()

[handoff]
; Used by answering machine hand off requires collectors to record the outgoing message on their own 
exten = s,1,Answer()
  ;same => n,Gosub(amh-script,s,1) for answering machine handoff based on worklist alias and extension
  same => n,Wait(1)
  same => n,WaitForSilence(1500,2,10)
  same => n,Execif($["${TRANSFERERNAME}"!=""]?Set(__CTTRANSFER=${CUT(CUT(TRANSFERERNAME,/,2),-,1)}):Set(__CTTRANSFER=${CUT(CUT(BLINDTRANSFER,/,2),-,1)}))
  same => n,Execif($["${CALLDIR}"="O"&"${CTTRANSFER}"=""]?Set(__CTTRANSFER=${ORIG_SRC}):NoOp())
  same => n,Execif($["${CALLDIR}"="I"&"${CTTRANSFER}"=""]?Set(__CTTRANSFER=${CTDEST}):NoOp())
  same => n,Playback(record/${CTTRANSFER})
  same => n,Hangup()

exten = h,1,NoOp(Handoff hungup)

[amh-script]
;This context is used in conjunction with their Answering machine handoff function to look up the Worklist alias and Extension and then relay that information when having the system leave a voicemail.
exten = s,1,Set(__Entity_ID=${CUT(ENTITY,^,1)})
  same => n,GotoIf($["${Entity_ID}" = ""]?notfound:)
  same => n,GotoIf($["${Entity_ID}" = "0"]?notfound:)
  same => n,Set(ALIAS=${ODBC_WORKLIST-ALIAS(${Entity_ID})})
  same => n,Set(ALIAS_EXT=${ODBC_WORKLIST-EXT(${Entity_ID})})
  same => n,NoOp(Worklist alias is ${ALIAS} and Worklist extension is ${ALIAS_EXT})
  same => n,System(/opt/swift/bin/swift -n Callie-8Khz -p audio/sampling-rate=8000 -o /tmp/${ENTITY}AMHScript.wav  This is... ${ALIAS}... with A...R...S...  Please reply to this message by calling... 1... 8... 5... 5... 2... 0... 7... 1... 8... 9... 2... extension... ${ALIAS_EXT:0:1}... ${ALIAS_EXT:1:1}... ${ALIAS_EXT:2:1}... thank you.)
  same => n,Return()
  same => n(notfound),Hangup()

[ai-handoff]
; Used by answering machine hand off uses AI voice to record the outgoing message on the fly
exten = s,1,Answer()
  same => n,Wait(1)
  same => n,Set(__Entity_ID=${CUT(ENTITY,^,1)})
  same => n,GotoIf($["${Entity_ID}" = "" | "${Entity_ID}" = "0"]?notfound:)
  same => n,Set(ALIAS=${ODBC_WORKLIST-ALIAS(${Entity_ID})})
  same => n,Set(ALIAS_EXT=${ODBC_WORKLIST-EXT(${Entity_ID})})
  same => n(JumpForTesting),NoOp(Worklist alias is ${ALIAS} and Worklist extension is ${ALIAS_EXT})
  same => n,Set(__Text=${ALIAS})
  same => n,Gosub(Azure-Text-To-Speech,s,1(en-US-AndrewMultilingualNeural,${Entity_ID}-ALIAS,1))
  same => n,Set(__Text=${ALIAS_EXT})
  same => n,Gosub(Azure-Text-To-Speech,s,1(en-US-AndrewMultilingualNeural,${Entity_ID}-ALIAS_EXT,1))
  same => n,System(printf "file '%s'\n" /var/lib/asterisk/sounds/record/ThisIs.ulaw "/var/lib/asterisk/sounds/record/tmp/${Entity_ID}-ALIAS.ulaw" /var/lib/asterisk/sounds/record/WithPlease.ulaw "/var/lib/asterisk/sounds/record/tmp/${Entity_ID}-ALIAS-EXT.ulaw" /var/lib/asterisk/sounds/record/ThankYou.ulaw > /var/lib/asterisk/sounds/record/tmp/${Entity_ID}.txt)
  same => n,System(ffmpeg -y -f concat -safe 0 -i /var/lib/asterisk/sounds/record/tmp/${Entity_ID}.txt -af "afade=t=in:st=0:d=0.05" -f mulaw -ar 8000 -ac 1 /var/lib/asterisk/sounds/record/tmp/${Entity_ID}-combined.ulaw)
  same => n,WaitForSilence(2000,2,10)
  same => n,Playback(/var/lib/asterisk/sounds/record/tmp/${Entity_ID}-combined)
  same => n,System(rm /var/lib/asterisk/sounds/record/tmp/${Entity_ID}-ALIAS.ulaw)
  same => n,System(rm /var/lib/asterisk/sounds/record/tmp/${Entity_ID}-ALIAS-EXT.ulaw)
  same => n,System(rm /var/lib/asterisk/sounds/record/tmp/${Entity_ID}-combined.ulaw)
  same => n,System(rm /var/lib/asterisk/sounds/record/tmp/${Entity_ID}.txt)
  same => n(notfound),Hangup()
  
exten = h,1,NoOp(Hung up on me... cleaning up...)
  same => n,System(rm /var/lib/asterisk/sounds/record/tmp/${Entity_ID}-ALIAS.ulaw)
  same => n,System(rm /var/lib/asterisk/sounds/record/tmp/${Entity_ID}-ALIAS-EXT.ulaw)
  same => n,System(rm /var/lib/asterisk/sounds/record/tmp/${Entity_ID}-combined.ulaw)
  same => n,System(rm /var/lib/asterisk/sounds/record/tmp/${Entity_ID}.txt)

[asterisk_guitools]
; Used by the PBX configuration tool to playback and record messages

; might be used not sure.
; exten = executecommand,1,System(${command})
;   same => n,Hangup()

exten = record_vmenu,1,Answer
  same => n,Playback(vm-intro)
  same => n,Record(${var1}.gsm,0,500,k)
  same => n,Playback(vm-saved)
  same => n,Playback(vm-goodbye)
  same => n,Hangup

exten = play_file,1,Answer
  same => n,Playback(${var1})
  same => n,Hangup

[PreDialHandler]
; Sets the PJSIP header for auto answering if var named AutoAnswer = 1

exten = s,1,NoOP( PreDialHandler )
  same => n,DumpChan()
  same => n,GotoIf($["${AutoAnswer}"="1"]?AutoAnswer:Skip)
  same => n(AutoAnswer),Set(PJSIP_HEADER(add,Alert-Info)=Internal)
  same => n(Skip),Return()

[VB-CAMPAIGN-INIT]
; VB Calls enter the dial plan here
; '_X.' matches any number, and any number of numbers.
exten = _X.,1,Goto(VB-CAMPAIGN-INIT2,${EXTEN},1)

[VB-CAMPAIGN-INIT2]
; This context sets VB vars from the VB app, sets CDRs, checks against the blacklist
; Handles no answers, once call is answered go to VB-CAMPAIGN-ANSWER

; New VB calls should enter here
exten = _1NXXNXXXXXX,1,NoOP(Voice Broadcast CTVBNAME ${CTVBNAME} ENTITY ${ENTITY} CTVBNUM ${CTVBNUM} CAMPAIGN ${CAMPAIGN} CTVBCONTEXT ${CTVBCONTEXT} CTVBQUEUE ${CTVBQUEUE} CTVBCALLID ${CTVBCALLID} VBCALLERID ${VBCALLERID} HUMANINITIATED ${HUMANINITIATED} )
  same => n,Goto(s,1)
; Or here
exten = _NXXNXXXXXX,1,NoOP(Voice Broadcast CTVBNAME ${CTVBNAME} ENTITY ${ENTITY} CTVBNUM ${CTVBNUM} CAMPAIGN ${CAMPAIGN} CTVBCONTEXT ${CTVBCONTEXT} CTVBQUEUE ${CTVBQUEUE} CTVBCALLID ${CTVBCALLID} VBCALLERID ${VBCALLERID} HUMANINITIATED ${HUMANINITIATED} )
  same => n,Goto(s,1)

exten = _XXXXXXX,1,NoOP(Voice Broadcast CTVBNAME ${CTVBNAME} ENTITY ${ENTITY} CTVBNUM ${CTVBNUM} CAMPAIGN ${CAMPAIGN} CTVBCONTEXT ${CTVBCONTEXT} CTVBQUEUE ${CTVBQUEUE} CTVBCALLID ${CTVBCALLID} VBCALLERID ${VBCALLERID} HUMANINITIATED ${HUMANINITIATED} )
  same => n,Goto(s,1)

; Copy originate vars to local channel so they will exist for the lifetime of the call
exten = s,1,NoOp()
  same => n,Set(__CTVBNAME=${CTVBNAME})
  same => n,Set(__ENTITY=${ENTITY})
  same => n,Set(__CTVBNUM=${CTVBNUM})
  same => n,Set(__CAMPAIGN=${CAMPAIGN})
  same => n,Set(__CTVBQUEUE=${CTVBQUEUE})
  same => n,Set(__CTVBCALLID=${CTVBCALLID})
  same => n,Set(__CTVBCONTEXT=${CTVBCONTEXT})
  same => n,Set(__VBCALLERID=${VBCALLERID})
  same => n,Set(__HUMANINITIATED=${HUMANINITIATED})

; set dialplan vars from originate vars
  same => n,Set(__CALLDIR=VB)
  same => n,Set(CDR(pbxid)=${PBXID})
  same => n,Set(CDR(dnid)=${CALLERID(dnid)})
  same => n,Set(__loopauth=1)
  same => n,Set(__ACODE=${IF($["${LEN(${CTVBNUM})}"="11"]?${CTVBNUM:1:3}:${CTVBNUM:0:3})})
  same => n,Set(__Entity_ID=${CUT(ENTITY,^,1)})
  same => n,Set(__entity_type=${CUT(ENTITY,^,2)}) ; set entity type from ENTITY
  same => n,Set(__QNM=${CTVBQUEUE})
  same => n,Set(__INTIME=${STRFTIME(${EPOCH},,%Y-%m-%d %H:%M:%S)})

; If CTVBCONTEXT is not set, set it to ENG1, else jump to jcdr
; aka default lang is ENG1 just like debtmaster
  same => n,ExecIf($["${CTVBCONTEXT}"=""]?Set(__CTVBCONTEXT=VB-ENG1):NoOp(CTVBCONTEXT=${CTVBCONTEXT}))

; set CDRs
  same => n,Set(CDR(userfield)=${ENTITY})
  same => n,Set(CDR(calltype)=VB)
  same => n,Set(CDR(campaign)=${CAMPAIGN})
  same => n,Set(CDR(destnum)=${CTVBNUM})
  same => n,NoCDR()

; This will set the callerid that the callee(debtor) will see
  same => n,Set(CALLERID(num)=${VBCALLERID})

;Check for area code
;  same => n,GoSub(sub-US-areacode-check,s,1)

; Check against black list, this could and should be reduced to 2 queries. ie select where O or B.
  same => n,GotoIf($[${ODBC_BLACKLIST('${CTVBNUM:-10}','O')}]?i,1:)

; If queue does not exist, call it invalid and dont call
  same => n,Gotoif($["$[QUEUE_EXISTS(${QNM})]"="0"]?i,1)
  
; Dial out
; b( context^exten^priority ) - Before initiating an outgoing call, Gosub to the specified location using the newly created channel. The Gosub will be executed for each destination channel.
; U( x^arg ) - Execute via Gosub the routine x for the called channel before connecting to the calling channel. The Gosub routine can set the variable GOSUB_RESULT to specify actions after the GoSub returns
; W - Allow the calling party to enable recording of the call by sending the DTMF sequence defined in features.conf.
; T - Allow the calling party to transfer the called party by sending the DTMF sequence defined in features.conf
; r - Default: Indicate ringing to the calling party, even if the called party isn't actually ringing. Pass no audio to the calling party until the called channel has answered
  same => n(dial),Set(trunkid=${IF($["${PJSIP_CONTACT(${PJSIP_AOR(SipService1,contact)},status)}"="Reachable"]?1:2)})
  same => n,Dial(PJSIP/${OUTPREFIX}${CTVBNUM}@${TRUNK}${trunkid},35,r(ring)TWb(VB_handler1,s,1)U(VB_handler2,s,1))
  same => n,Goto(s-${DIALSTATUS},1)

exten = s-NOANSWER,1,Set(__VBRESULT=NOANSWER)
  same => n,Goto(AGIRESULT,1)

exten = s-BUSY,1,Set(__VBRESULT=BUSY)
  same => n,Goto(AGIRESULT,1)

exten = s-CONGESTION,1,Set(loopauth=${MATH(${loopauth}-1,int)})
  same => n,Wait(${RAND(0,2)}.${RAND(1,9)})
  same => n,GotoIf($["${loopauth}"!="0"]?s,dial:Cong,1)

; got chan unavailable
exten = s-CHANUNAVAIL,1,Set(loopauth=${MATH(${loopauth}-1,int)})
  same => n,Wait(${RAND(0,2)}.${RAND(1,9)})
  same => n,GotoIf($["${loopauth}"!="0"]?s,dial:Chan,1)

exten = Cong,1,Set(__VBRESULT=CONGESTION)
  same => n,Goto(AGIRESULT,1)

exten = Chan,1,Set(__VBRESULT=CHANUNAVAIL)
  same => n,Goto(AGIRESULT,1)

exten = s-CANCEL,1,Set(__VBRESULT=CHANUNAVAIL)
  same => n,Goto(AGIRESULT,1)

exten = s-DONTCALL,1,Set(__VBRESULT=DNC)
  same => n,Goto(AGIRESULT,1)

exten = s-TORTURE,1,Set(__VBRESULT=DNC)
  same => n,Goto(AGIRESULT,1)

exten = i,1,Set(__VBRESULT=INVALID)
  same => n,Wait(2)
  same => n,Goto(AGIRESULT,1)

exten = AGIRESULT,1,AGI(agi://${VBSERVER}:5056/CTCOMMAND=VB&ENTITY=${ENTITY}&VBRESULT=${IF($["${VBRESULT}"=""]?HANGUP:${VBRESULT})}&VBCALLID=${CTVBCALLID})
  same => n,Hangup()

[VB_handler1]
; Runs before the call connects, place holder for future features

exten = s,1,NoOp(VB_handler1)

; pace it out, randomly wait between 0-3.9 seconds
  same => n,wait(${RAND(0,3)}.${RAND(0,9)})

  same => n,return()

[VB_handler2]
; Sets a vars on the master channel so they can make it to the end of the call

; vars on master channel redirect the callee lag to queue.
exten = s,1,Set(MASTER_CHANNEL(clrFCH)=${CHANNEL(name)})

; set dialplan vars on the master channel so they will be there for the lifetime of the call
  same => n,Set(MASTER_CHANNEL(CTVBNAME)=${CTVBNAME})
  same => n,Set(MASTER_CHANNEL(ENTITY)=${ENTITY})
  same => n,Set(MASTER_CHANNEL(CTVBNUM)=${CTVBNUM})
  same => n,Set(MASTER_CHANNEL(CAMPAIGN)=${CAMPAIGN})
  same => n,Set(MASTER_CHANNEL(CTVBQUEUE)=${CTVBQUEUE})
  same => n,Set(MASTER_CHANNEL(CTVBCALLID)=${CTVBCALLID})
  same => n,Set(MASTER_CHANNEL(CTVBCONTEXT)=${CTVBCONTEXT})
  same => n,Set(MASTER_CHANNEL(VBCALLERID)=${VBCALLERID})
  same => n,Set(MASTER_CHANNEL(HUMANINITIATED)=${HUMANINITIATED})
  same => n,Set(MASTER_CHANNEL(Entity_ID)=${Entity_ID})
  same => n,Set(MASTER_CHANNEL(entity_type)=${entity_type})
  same => n,Set(MASTER_CHANNEL(CALLDIR)=${CALLDIR})
  same => n,Set(MASTER_CHANNEL(QNM)=${CTVBQUEUE})

;  same => n,dumpchan()
  same => n,Return()

[VB_hangup_handler]
; Place holder hangup handler for future features

exten = s,1,Return()

[QUEUE-VB]
exten = s,1,Answer
;  same => n,dumpchan()

; Start call recording
  same => n,ResetCDR(e)
  same => n,Gosub(VB-record-call,s,1,(${QNM},${ENTITY}))

; Set display on collector's phone
  same => n,Set(CALLERID(name)=${DB(PhoneDisplay/${QNM})}-${CTVBNAME})
  same => n,Set(CALLERID(num)=${CTVBNUM})

; Send to queue with timeout
  same => n,Queue(${QNM},twr,,,${DB(TimeInQueue/${QNM})})

; Check if ReturnVM is set, if so, go to Return VM
  same => n,ExecIf($["${DB(ReturnVM/${QNM})}"=""]?NoOp(No return ReturnVM set):Gosub(VMBox,s,1(${DB(ReturnVM/${QNM})},u)))

; Check if ReturnContext is set and valid, if so, go to ReturnContext,s,1
  same => n,GotoIf($["${DB(ReturnContext/${QNM})}"=""]?SkipReturnContext:)
  same => n,ExecIf($[DIALPLAN_EXISTS(${DB(ReturnContext/${QNM})},s,1)]?Goto(${DB(ReturnContext/${QNM})},s,1):NoOp( ERROR return context ${DB(ReturnContext/${QNM})},s,1 is not valid))

; Check if ReturnQueue is set, if so, Set QNM = ReturnQueue
  same => n(SkipReturnContext),ExecIf($["${DB(ReturnQueue/${QNM})}"=""]?NoOp(No return ReturnQUEUE set):Set(__QNM=${DB(ReturnQueue/${QNM})}))

; Check if the call failed to join the queue, continue, else goto QUEUE-VB,s,1 assuming Return queue was set. 
  same => n,GotoIf($["${QUEUESTATUS}"="LEAVEEMPTY" | "${QUEUESTATUS}"="JOINEMPTY"]?:QUEUE-VB,s,1)          ; If we can't join the queue and there's no where else to go this would loop, somethings big wrong, pushed to closed

; If failed to join queue and ReturnQueue = QNM, hangup. Loop prevention. 
  same => n,ExecIf($["${DB(ReturnQueue/${QNM})}"="${QNM}"]?Hangup():Goto(QUEUE-VB,s,1))

; Abandon ship, somethings wrong, don't know how to route call
  same => n,NoOp(ERROR cant route VB call. Something is wrong in either VB or dialplan)
  same => n,hangup()

; When call is hungup, update recording info.
exten = h,1,Gosub(VB-update-recording,s,1)

[VB-record-call]
; ARG1 is QNM
; ARG2 is ENTITY
; Sets call recording vars and starts recording call

exten = s,1,NoOp()
  same => n,GotoIf($["${sanity}"="1"]?rtn)
  same => n,Set(__sanity=1) ;sanity check for update recording to make sure I came here before. JAR
  same => n,Set(__CTSOURCE=${IF($["${CALLERID(num)}"=""]?unknown:${CALLERID(num)})})
  same => n,Set(__MIXMONITOR_FILENAME=${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${UNIQUEID})
  same => n,Set(__RECORD_NAME=${MIXMONITOR_FILENAME}.${FILEEXTENSION})
  same => n,Set(__DATETIME=${STRFTIME(${EPOCH},,%Y-%m-%d)})
  same => n,Set(__RECSTRT=${STRFTIME(${EPOCH},,%Y-%m-%d %H:%M:%S)})
  same => n,Set(__RECSTSEC=${STRFTIME(${EPOCH})})
  same => n,Set(__CTRECORD=TRUE)
  same => n,Set(MASTER_CHANNEL(CTRECORD)=${CTRECORD})
  same => n,MixMonitor(${MIXMONITOR_FILENAME}.wav,r(${MIXMONITOR_FILENAME}r.wav)t(${MIXMONITOR_FILENAME}t.wav),/etc/asterisk/recording ${MIXMONITOR_FILENAME}r.wav ${MIXMONITOR_FILENAME}t.wav ${Entity_ID})
  same => n(rtn),Return()

[VB-update-recording]
; Sets more call recording vars and then sends call recording data via ODBC to debtmaster
; ${RECORD_NAME} is set in VB-record-call
; ${Entity_ID} is cut from entity in VB-CAMPAIGN-INIT
; ${ENTITY_TYPE} is a cut from entity in VB-CAMPAIGN-INIT

; Get extension that answered the call
exten = s,1,StopMixMonitor()
  same => n,Set(puexten=${CUT(CDR(dstchannel),-,1)})
  same => n,Set(puexten=${CUT(puexten,/,2)})
  same => n,NoOp( CDR(dstchannel) ${CDR(dstchannel)} puexten ${puexten} )

; Get DM user id from extension
  same => n,Gotoif($["${puexten}"=""]?nopuexten)    ; Skip if puexten is null
  same => n,Set(__usrid=${ODBC_USERID(${puexten})})

; Set ORIG_SRC as queue name
  same => n(nopuexten),Set(ORIG_SRC=${CTVBQUEUE})

; Set CTDEST to the number VB dialed
  same => n,Set(CTDEST=${CTVBNUM})

; Get file path of recording
  same => n,Set(RECPATH=/${STRFTIME(${EPOCH},,%Y/%m/%d)})

; Set RECEND = call end time
  same => n,Set(RECEND=${STRFTIME(${EPOCH},,%Y-%m-%d %H:%M:%S)})

; Set ENTITY to include User id of the extension that answered the call
  same => n,Set(__ENTITY=${CUT(ENTITY,^,-2)}^${usrid})

; Reset CDRs for answered calls
  same => n,Set(CDR(userfield)=${ENTITY})
  same => n,Set(CDR(calltype)=VB)
  same => n,Set(CDR(campaign)=${CAMPAIGN})
  same => n,Set(CDR(destnum)=${CTVBNUM})
  ;same => n,Set(CDR(dst)=${CTVBNUM})    ;Needed to display outbound number correctly in the Debtor Call history
  ; above line does not work in asterisk 20+ CDR(dst) is not writable and will just error AWH 9-9-24

; Check if extension is set for no record
;  same => n,GotoIf($[${DB_EXISTS(EXTENSION/NORECORD/${ARG2})}=1]?rtn:)
;  same => n,GotoIf($[${DB_EXISTS(EXTENSION/NORECORD/${ARG1})}=1]?rtn:)

; Send recording information to debtmaster then hangup
  same => n,GoSub(sub-save-recording-record,s,1)
  same => n(quit),Return()

[sub-VB-CAMPAIGN-RESULT]
; Set results, send results, and then hangs up
; ARG1 will be one of NOANSWER BUSY CONGESTION CHANUNAVAIL CANCEL INVALID MACHINE TIMEOUT HANGUP

exten = s,1,Set(VBRESULT=${ARG1})

; Send results to VB and then hangup
  same => n(agi),AGI(agi://${VBSERVER}:5056/CTCOMMAND=VB&ENTITY=${ENTITY}&VBRESULT=${VBRESULT}&VBCALLID=${CTVBCALLID})
  same => n,return()

; When call is hungup, update recording info.
exten = h,1,Gosub(VB-update-recording,s,1)


[sub-BLAST-VB-ENG1]
exten = s,1,NoOp(BLAST VB ENG1)
  same => n,Set(__Text=${CTVBNAME})
  same => n,Gosub(Azure-Text-To-Speech,s,1(en-US-SerenaMultilingualNeural,${CTVBNUM}-${CTVBNAME},1))
  same => n,Set(__Text=${Entity_ID})
  same => n,Gosub(Azure-Text-To-Speech,s,1(en-US-SerenaMultilingualNeural,${CTVBNUM}-${Entity_ID},1))
  same => n,System(printf "file '%s'\n" /var/lib/asterisk/sounds/record/AnUrgentMessage.ulaw "/var/lib/asterisk/sounds/record/tmp/${CTVBNUM}-${CTVBNAME}.ulaw" /var/lib/asterisk/sounds/record/RegardingReference.ulaw "/var/lib/asterisk/sounds/record/tmp/${CTVBNUM}-${Entity_ID}.ulaw" /var/lib/asterisk/sounds/record/PleaseCall.ulaw > /var/lib/asterisk/sounds/record/tmp/${CTVBNUM}.txt)
  same => n,System(ffmpeg -y -f concat -safe 0 -i /var/lib/asterisk/sounds/record/tmp/${CTVBNUM}.txt -af "afade=t=in:st=0:d=0.05" -f mulaw -ar 8000 -ac 1 /var/lib/asterisk/sounds/record/tmp/${CTVBNUM}-combined.ulaw)
  same => n,System(rm /var/lib/asterisk/sounds/record/tmp/${CTVBNUM}-${CTVBNAME}.ulaw /var/lib/asterisk/sounds/record/tmp/${CTVBNUM}-${Entity_ID}.ulaw /var/lib/asterisk/sounds/record/tmp/${CTVBNUM}.txt)
  same => n,Return()

[Azure-Text-To-Speech]
; ARG1 = voice to use
; ARG2 = uniq ID for sound file
; ARG3 = 1 if you want this context to make the file but not play it or remove it.

exten = s,1,NoOp(Testing Azure-Text-To-Speech)
  same => n,set(__Voice=${ARG1})
  same => n,set(__FileName=/var/lib/asterisk/sounds/record/tmp/${ARG2}.ulaw)
  same => n,AGI(/etc/asterisk/AzureTextToSpeech.py)
  same => n,Gotoif($["${TextToSpeech}"="FAILED"]?ERROR:)
  same => n,Execif($["${ARG3}"="1"]?NoOp(not playing file):playback(/var/lib/asterisk/sounds/record/tmp/${ARG2}))
  same => n,Execif($["${ARG3}"="1"]?NoOp(Keeping file):system(rm ${FileName}))
  same => n,return()

; If text to speech failed, send error to VB application and hangup
  same => n(ERROR),NoOp(ERROR failed to do Azure text to speech)
  same => n,hangup()

; When call is hungup, update recording info.
exten = h,1,system(rm ${FileName})

[VB-BLAST-AMD]
; Do answer machine detection, redirect far channel to human or machine

exten = s,1,Playback(silence/1)
  same => n,AMD
  same => n,GotoIf($["${AMDSTATUS}"="HUMAN"]?VB-BLAST-HUMAN,s,1:VB-BLAST-MACHINE,s,1)

exten = h,1,AGI(agi://${VBSERVER}:5056/CTCOMMAND=VB&ENTITY=${ENTITY}&VBRESULT=HANGUP&VBCALLID=${CTVBCALLID})
