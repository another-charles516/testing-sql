[sub-listen-in]
; Check if we can, then spy on a given extension.
; ARG1 = extension to be spied on
; If DB(EXTOPTIONS/${ARG1} ) does not have BRG set, hangup.

exten = s,1,Answer
  same => n,GotoIf(${DB_EXISTS(EXTOPTIONS/${ARG1})}?:hangup)            ; If record does not exist then hangup.
  same => n,Set(OPTIONS=${CUT(${DB_RESULT},^,1)})                                       ; set options from a cut of DB(EXTOPTIONS/${ARG1})
  same => n,GotoIf($[${OPTIONS}=BRG]?:hangup)                                   ; if options is not set to BRG then hangup
  same => n,ChanSpy(SIP/${ARG1},${CTBARGEOPTIONS})                            ; CTBARGEOPTIONS will be set by Switchboard
  same => n(hangup),Hangup()
  same => n,return()

[sub-blacklist]
; Checks phone number against blacklist in postgresql
; ARG1 is number
; ARG2 is direction I O or B

exten = s,1,NoOp()

; case statement for B I or O
  same => n,GotoIf($["${ARG2}"="B"]?CheckB,1:)
  same => n,GotoIf($["${ARG2}"="I"]?CheckI,1:)
  same => n,GotoIf($["${ARG2}"="O"]?CheckO,1:)
  same => n,hangup()

exten = CheckB,1,NoOp()
  same => n,ExecIf($["${BLCB}"="T"]?return():NoOp(Checking blacklist...)) ; if it's already checked return
  same => n,ExecIf($[${ODBC_BLACKLIST('${ARG1:-10}','B')}]?Goto(blacklist,1):NoOp(Passed blacklist)) ; If record found, blacklist
  same => n,set(__BLCB=T) ; Set this so we don't try to check it on the blacklist again.
  same => n,return()

exten = CheckI,1,NoOp()
  same => n,ExecIf($["${BLCI}"="T"]?Return():NoOp(Checking blacklist...))  ; if it's already checked return
  same => n,ExecIf($["${BLCB}"="T"]?Return():NoOp(Checking blacklist...))  ; if B was checked it's also good to return
  same => n,ExecIf($[${ODBC_BLACKLIST('${ARG1:-10}','I')}]?Goto(blacklist,1):NoOp(Passed blacklist)) ; If record found, blacklist
  same => n,set(__BLCI=T) ; Set this so we don't try to check it on the blacklist again.
  same => n,return()

exten = CheckO,1,NoOp()
  same => n,ExecIf($["${BLCO}"="T"]?Return():NoOp(Checking blacklist...)) ; if it's already checked return
  same => n,ExecIf($["${BLCB}"="T"]?Return():NoOp(Checking blacklist...)) ; if B was checked it's also good to return
  same => n,ExecIf($[${ODBC_BLACKLIST('${ARG1:-10}','O')}]?Goto(blacklist,1):NoOp(Passed blacklist)) ; If record found, blacklist
  same => n,set(__BLCO=T) ; Set this so we don't try to check it on the blacklist again.
  same => n,return()

